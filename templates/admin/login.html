{% load i18n static %}
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng nhập · Ami Perfumery Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root {
  --olive: #4B672D; --olive-dark: #344e1f; --sage: #EBF6C4;
  --cream: #faf8f3; --stone: #e8e2d8; --text: #1a1c14; --text3: #7a7d6e;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', system-ui, sans-serif;
  background: linear-gradient(135deg, var(--olive-dark) 0%, #2a3d17 40%, #1a2a0a 100%);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23EBF6C4' fill-opacity='0.03'%3E%3Ccircle cx='30' cy='30' r='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  pointer-events: none;
}
.login-card {
  background: rgba(250,248,243,.97);
  backdrop-filter: blur(20px);
  border-radius: 24px;
  padding: 52px 48px;
  width: 100%; max-width: 420px;
  box-shadow: 0 32px 80px rgba(0,0,0,.35), 0 0 0 1px rgba(235,246,196,.15);
  position: relative;
}
.login-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, var(--olive-dark), var(--olive), #7a9e4a, var(--sage));
  border-radius: 24px 24px 0 0;
}
.logo { text-align: center; margin-bottom: 36px; }
.logo-text { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 300; letter-spacing: 4px; text-transform: uppercase; color: var(--olive-dark); }
.logo-text em { font-style: italic; font-weight: 300; opacity: .65; }
.logo-sub { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--text3); margin-top: 4px; }
h1 { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 300; color: var(--text); margin-bottom: 24px; text-align: center; }
.field { margin-bottom: 18px; }
label { display: block; font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--text3); margin-bottom: 7px; }
input[type="text"], input[type="password"] {
  width: 100%; padding: 13px 16px; border: 1.5px solid var(--stone); border-radius: 10px;
  font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text);
  background: var(--cream); outline: none; transition: .2s;
}
input[type="text"]:focus, input[type="password"]:focus {
  border-color: var(--olive); box-shadow: 0 0 0 3px rgba(75,103,45,.12);
}
.errornote { background: rgba(184,50,50,.1); border: 1px solid rgba(184,50,50,.25); border-radius: 8px; padding: 12px 16px; font-size: 13px; color: #b83232; margin-bottom: 18px; }
.submit-btn {
  width: 100%; padding: 14px; background: linear-gradient(135deg, var(--olive-dark), var(--olive));
  color: var(--sage); border: none; border-radius: 40px; font-family: 'DM Sans', sans-serif;
  font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
  transition: all .25s; margin-top: 8px;
}
.submit-btn:hover { box-shadow: 0 6px 20px rgba(75,103,45,.4); transform: translateY(-1px); }
.login-footer { text-align: center; margin-top: 28px; font-size: 11px; color: var(--text3); }
.login-footer a { color: var(--olive); text-decoration: none; }
</style>
</head>
<body>
<div class="login-card">
  <div class="logo">
    <div class="logo-text">Ami <em>Perfumery</em></div>
    <div class="logo-sub">Hệ thống quản trị</div>
  </div>

  {% if form.errors %}
  <div class="errornote">
    ⚠️ Tên đăng nhập hoặc mật khẩu không đúng. Vui lòng thử lại.
  </div>
  {% endif %}

  <h1>Đăng nhập quản trị</h1>

  <form method="post" action="{{ app_path }}" id="login-form">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">

    <div class="field">
      <label for="id_username">Tên đăng nhập</label>
      <input type="text" name="username" id="id_username" autofocus autocomplete="username"
             value="{{ form.username.value|default:'' }}" placeholder="Nhập tên đăng nhập">
    </div>

    <div class="field">
      <label for="id_password">Mật khẩu</label>
      <input type="password" name="password" id="id_password" autocomplete="current-password" placeholder="••••••••">
    </div>

    <button type="submit" class="submit-btn">Đăng nhập →</button>
  </form>

  <div class="login-footer">
    <a href="/">← Quay về trang chủ</a>
  </div>
</div>
</body>
</html>
